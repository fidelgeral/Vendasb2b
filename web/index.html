<!DOCTYPE html>
<html lang="pt-MZ">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VENDASB2B</title>
    <meta name="theme-color" content="#1E5BA8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      /* Ecrã de carregamento (logótipo) — visível enquanto a app arranca. É
         substituído automaticamente quando o React monta dentro de #root. */
      #vb-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: linear-gradient(135deg, #f6f8fb 0%, #eef2f7 100%);
        z-index: 9999;
      }
      #vb-splash img {
        width: min(72vw, 420px);
        height: auto;
        display: block;
        filter: drop-shadow(0 8px 24px rgba(30, 91, 168, 0.12));
      }
      #vb-splash .vb-spin {
        width: 34px;
        height: 34px;
        border: 3px solid rgba(31, 142, 142, 0.25);
        border-top-color: #1f8e8e;
        border-radius: 50%;
        animation: vb-rot 0.8s linear infinite;
      }
      @keyframes vb-rot {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="vb-splash">
        <img src="/vb-logo.jpg" alt="VENDASB2B" />
        <div class="vb-spin" role="status" aria-label="A carregar"></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
    <script>if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js"))</script>
  </body>
</html>
